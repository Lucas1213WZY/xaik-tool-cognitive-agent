[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xaik-tool-cognitive-agent"
version = "0.1.0"
description = "Cognitive-agent XAI toolkit for CoAX and CoXAM workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
    "scikit-learn>=1.6,<2",
    "matplotlib>=3.9,<4",
    "pyyaml>=6.0,<7",
    "requests>=2.32,<3",
    "tqdm>=4.67,<5",
]

[project.optional-dependencies]
xai = [
    "torch>=2.5,<3",
    "xgboost>=2.1,<4",
    "captum>=0.8,<0.9",
    "lime>=0.2.0.1,<0.3",
    "shap>=0.48,<0.50",
    "numba>=0.60,<0.62",
    "imodels>=2.0,<3",
    "mlxtend>=0.23,<0.24",
]
rl = [
    "gymnasium>=1.1,<2",
    "gym>=0.26,<0.27",
    "stable-baselines3>=2.6,<3",
    "sb3-contrib>=2.6,<3",
]
data = [
    "ucimlrepo>=0.0.7,<0.1",
    "datasets>=4.4,<5",
    "openpyxl>=3.1,<4",
]
api = [
    "fastapi>=0.115,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.30,<1",
]
notebooks = [
    "jupyter>=1.1,<2",
    "notebook>=7.5,<8",
    "ipykernel>=6.29,<7",
    "ipywidgets>=8.1,<9",
    "nbformat>=5.10,<6",
]
viz = [
    "scikit-image>=0.24,<0.26",
    "statsmodels>=0.14,<0.15",
    "seaborn>=0.13,<0.14",
    "plotly>=6.2,<7",
    "rich>=14.1,<15",
    "tabulate>=0.9,<1",
    "prettytable>=3.16,<4",
]
dev = [
    "pytest>=9,<10",
]
all = [
    "xaik-tool-cognitive-agent[xai,rl,data,api,notebooks,viz,dev]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = [
    "assets*",
    "code_for_papers*",
    "datasets*",
    "experiments*",
    "experiment_execution_interface*",
    "notebooks*",
    "tests*",
    "user_simulation*",
]
namespaces = true
